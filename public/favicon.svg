<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#008CFF" />
    </linearGradient>
    <linearGradient id="cyberRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#D50000" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glass Hexagon -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#071426" stroke="url(#cyberBlue)" stroke-width="3" opacity="0.9" filter="url(#neonGlow)" />
  <!-- Left Blue Energy Wing -->
  <path d="M 24 70 L 24 30 L 50 56 L 50 78 Z" fill="url(#cyberBlue)" opacity="0.85" />
  <!-- Right Red Energy Wing -->
  <path d="M 76 70 L 76 30 L 50 56 L 50 78 Z" fill="url(#cyberRed)" opacity="0.85" />
  <!-- Center Core Prism -->
  <circle cx="50" cy="50" r="7" fill="#F1F5F9" filter="url(#neonGlow)" />
  <!-- Ambient Inner Ring -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="rgba(0, 217, 255, 0.4)" stroke-dasharray="4 6" stroke-width="1.5" />
</svg>
